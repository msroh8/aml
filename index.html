.eyebrow{font-size:15px;font-weight:700;color:#a05a38;letter-spacing:.02em;margin-bottom:6px;display:flex;align-items:center;gap:7px}.eyebrow:before{content:'';width:22px;height:3px;background:var(--orange);border-radius:2px}h2{font-size:36px;line-height:1.6;letter-spacing:-.65px;margin-bottom:17px}h3{font-size:22.5px;line-height:1.7;margin-bottom:8px}.ink-underline{background:linear-gradient(transparent 69%,#f7d47577 69% 92%,transparent 92%);padding:0 4px}.source-text{font-size:21px;line-height:2.05;max-width:880px}.source-text+.source-text{margin-top:14px}.source-callout{position:relative;padding:11px 19px;border-right:3px solid #e9a476;margin:15px 0 5px;max-width:880px;background:linear-gradient(90deg,transparent,#fff0cf66)}.source-callout p{font-size:20px;line-height:2}.source-callout .note-title{font-size:15px;color:#b0643c;font-weight:700;margin-bottom:2px}.page-source{font-size:12.5px;color:#81938c;margin-top:15px}.micro-label{font-size:14px;color:#7c8e86;display:flex;align-items:center;gap:6px}.underlined-heading{display:inline-block;border-bottom:3px solid #e8bb6277;padding-bottom:3px;margin:10px 0 8px}.small-action,.pill-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;padding:8px 14px;min-height:44px;background:#f3f1e5;border:1px solid #d4d8c7;box-shadow:0 2px 0 #d9decb;font-size:15px}.small-action.primary{background:var(--teal);color:white;border-color:var(--teal);box-shadow:0 3px 0 #0d5c54}.small-action:hover,.pill-button:hover{filter:brightness(.98)}.inline-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.accent{color:var(--teal)}

<script>/* Small offline 3D renderer. Geometry is transformed, depth sorted, lit,
   projected and hit-tested; the raised state changes the mesh height and
   camera angle. No remote library or image is required. */
(()=>{'use strict';
const C={ink:'#315c59',mint:'#b9dbc7',teal:'#579d8e',cream:'#fff4d5',yellow:'#f5ca68',orange:'#e9a17d',blue:'#96c6cc',pink:'#ddb0b9'};
const mix=(a,b,t)=>a+(b-a)*t;
function shade(hex,k){const x=hex.replace('#','');const a=[0,2,4].map(i=>parseInt(x.slice(i,i+2),16));return `rgb(${a.map(v=>Math.round(Math.max(0,Math.min(255,v*k)))).join(',')})`;}
function round(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function city(ctx,w,h,variant=0){
 ctx.fillStyle=variant===1?'#e9c3b8':variant===2?'#d2e4bd':'#bce0df';ctx.fillRect(0,0,w,h);
 ctx.fillStyle='#f7d170';ctx.beginPath();ctx.arc(w*.79,h*.22,w*.09,0,Math.PI*2);ctx.fill();
 const buildings=[[.04,.16,.44],[.23,.17,.62],[.45,.14,.49],[.64,.13,.72],[.81,.15,.39]];
 buildings.forEach((b,i)=>{let [xx,ww,hh]=b;xx*=w;ww*=w;hh*=h;ctx.fillStyle=['#6fa69f','#4d8d88','#91bbb0','#437c7e','#7aa59a'][i];round(ctx,xx,h*.87-hh,ww,hh,3);ctx.fill();if(i===3){ctx.beginPath();ctx.moveTo(xx,h*.87-hh);ctx.lineTo(xx+ww/2,h*.87-hh-h*.15);ctx.lineTo(xx+ww,h*.87-hh);ctx.fill();ctx.fillStyle='#d6ebe0';ctx.fillRect(xx+ww*.3,h*.87-hh+h*.1,ww*.4,h*.1);}
 ctx.fillStyle='#f6dfad';for(let ry=h*.87-hh+h*.08;ry<h*.81;ry+=h*.13){for(let rx=xx+ww*.18;rx<xx+ww*.8;rx+=ww*.37){ctx.fillRect(rx,ry,ww*.13,h*.055);}}});
 ctx.fillStyle='#d6c394';ctx.fillRect(0,h*.87,w,h*.13);ctx.fillStyle='#548b70';
 for(let i=0;i<4;i++){const x=w*(i*.28+.04);ctx.fillStyle='#a58256';ctx.fillRect(x,h*.69,w*.012,h*.24);ctx.fillStyle='#4f8c6d';ctx.beginPath();ctx.ellipse(x,h*.7,w*.055,h*.07,0,0,Math.PI*2);ctx.fill();}
}
const textureCache=new Map();
function texture(kind,label='',variant=0){const key=kind+label+variant;if(textureCache.has(key))return textureCache.get(key);const cv=document.createElement('canvas');cv.width=400;cv.height=280;let x=cv.getContext('2d');x.fillStyle='#fff7df';x.fillRect(0,0,400,280);x.strokeStyle=C.ink;x.lineWidth=6;

const source=(text,cls='')=>`<p class="source-text ${cls}">${esc(text)}</p>`;

const check=(q,answers,correct,evidence)=>`<section class="check-block" data-correct="${correct}" data-evidence="${esc(evidence)}"><button class="check-trigger" aria-expanded="false">${I('target',18)}تحقق من فهمك</button><div class="check-content"><p class="check-question">${esc(q)}</p><div class="choice-row">${answers.map((a,i)=>`<button class="answer-choice" data-answer="${i}">${esc(a)}</button>`).join('')}</div><p class="check-feedback" aria-live="polite"></p></div></section>`;
const captionContent=(title,text,context='')=>`<strong class="caption-title">${esc(title)}</strong>${context?`<p class="caption-context">${esc(context)}</p>`:''}<p class="caption-copy">${esc(text)}</p>`;

 {type:'choice',q:'تريد تحديد مدة مقطع الفيديو. أي خيار تستخدم؟',answers:['صور (Images)','كبير (Large)','الأدوات (Tools)'],correct:2,evidence:S.videoTools},
 {type:'choice',q:'أي مقاطع الفيديو يمكنك تنزيلها وفق الدرس؟',answers:['جميع مقاطع الفيديو','مقاطع الفيديو المجانية فقط','المقاطع الطويلة فقط'],correct:1,evidence:S.videoNote}
];
let game={round:0,scores:[0,0],answered:false,correct:null,choice:null,order:null,finished:false};
function resetGame(){game={round:0,scores:[0,0],answered:false,correct:null,choice:null,order:null,finished:false};renderGame();}
function scoreHTML(){let team=game.round%2;return `<div class="scoreboard" aria-label="لوحة النقاط"><div class="team-score ${!game.finished&&team===0?'active':''}"><span class="team-name">الفريق الأول</span><strong class="team-count" id="scoreOne">${ar(game.scores[0])}</strong></div><div class="team-score team-two ${!game.finished&&team===1?'active':''}"><span class="team-name">الفريق الثاني</span><strong class="team-count" id="scoreTwo">${ar(game.scores[1])}</strong></div></div>`;}
function renderGame(){let root=$('#gameRoot');if(!root)return;if(game.finished){let winner=game.scores[0]===game.scores[1]?'تعادل الفريقان':game.scores[0]>game.scores[1]?'فاز الفريق الأول':'فاز الفريق الثاني';root.innerHTML=scoreHTML()+`<div class="winner-view"><span class="trophy" aria-hidden="true">${trophy()}</span><h3>${winner}</h3><p>اكتمل تحدي الفريقين</p><div class="result-detail"><span>الفريق الأول: ${ar(game.scores[0])}</span><span>الفريق الثاني: ${ar(game.scores[1])}</span></div><div class="cover-start"><button class="small-action primary" id="restartGame">${I('refresh',17)}إعادة النشاط</button><button class="small-action" data-go="0">${I('index',17)}الفهرس</button></div></div>`;$('#restartGame').addEventListener('click',resetGame);$('[data-go]',root).addEventListener('click',()=>renderPage(0,{toc:true}));confetti(root);return;}const r=rounds[game.round],kind={choice:'اختيار',order:'ترتيب',hotspot:'حدّد الخيار'}[r.type];if(r.type==='order'&&!game.order)game.order=[...r.shuffle];root.innerHTML=scoreHTML()+`<p class="turn-label" aria-live="polite">الدور على ${game.round%2===0?'الفريق الأول':'الفريق الثاني'}</p><div class="round-top"><span>التحدي ${ar(game.round+1)} من ${ar(rounds.length)}</span><span class="question-kind">${kind} · ١٠ نقاط</span></div><h3 class="game-question">${esc(r.q)}</h3><div class="game-task">${r.type==='order'?orderHTML(r):r.type==='hotspot'?`<div class="game-hotspot"><div class="browser-bar" style="border-radius:8px"><div class="browser-address">الرياض</div>${I('search',18)}</div><div class="hotspot-tabs">${r.answers.map((a,i)=>answerHTML(a,i,true)).join('')}</div></div>`:`<div class="game-answers">${r.answers.map((a,i)=>answerHTML(a,i,false)).join('')}</div>`}</div><div class="game-feedback ${game.answered?(game.correct?'success':'error'):''}" aria-live="polite">${game.answered?(game.correct?'إجابة صحيحة · أُضيفت ١٠ نقاط. ':'الإجابة غير صحيحة. ')+esc(r.evidence):'أجب ثم انتقل إلى التحدي التالي.'}</div><div class="game-actions"><button class="small-action primary" id="nextRound" ${game.answered?'':'disabled'}>${game.round===rounds.length-1?'إظهار النتيجة':'التحدي التالي'}${I('arrowLeft',17)}</button><button class="small-action" id="restartGame">${I('refresh',16)}إعادة النشاط</button></div>`;
 $$('[data-game-answer]',root).forEach(b=>b.addEventListener('click',()=>grade(+b.dataset.gameAnswer===r.correct,+b.dataset.gameAnswer)));
 $$('[data-order-move]',root).forEach(b=>b.addEventListener('click',()=>{let index=+b.dataset.index,other=index+(+b.dataset.orderMove);[game.order[index],game.order[other]]=[game.order[other],game.order[index]];renderGame();}));
 const orderButton=$('#checkOrder');if(orderButton)orderButton.addEventListener('click',()=>grade(game.order.every((n,i)=>n===i),null));
 $('#nextRound').addEventListener('click',()=>{if(!game.answered)return;if(game.round===rounds.length-1)game.finished=true;else{game.round++;game.answered=false;game.correct=null;game.choice=null;game.order=null;}renderGame();$('#gameRoot').scrollIntoView({block:'start',behavior:'smooth'});});$('#restartGame').addEventListener('click',resetGame);
}
function answerHTML(a,i,hotspot){const r=rounds[game.round];let cls='';if(game.answered){if(i===r.correct)cls='correct';else if(i===game.choice)cls='wrong';}return `<button class="${hotspot?'':'game-answer '}${cls}" data-game-answer="${i}" ${game.answered?'disabled':''}>${hotspot?'':`<span class="letter">${'أبجد'[i]}</span>`}<span>${esc(a)}</span></button>`;}
function orderHTML(r){return `<ol class="order-list">${game.order.map((n,i)=>`<li class="order-item"><span class="order-no">${ar(i+1)}</span><span class="order-text">${esc(r.items[n])}</span><button class="order-move" data-order-move="-1" data-index="${i}" ${game.answered||i===0?'disabled':''} aria-label="تقديم الخطوة ${ar(i+1)}">↑</button><button class="order-move" data-order-move="1" data-index="${i}" ${game.answered||i===game.order.length-1?'disabled':''} aria-label="تأخير الخطوة ${ar(i+1)}">↓</button></li>`).join('')}</ol><button class="small-action order-check" id="checkOrder" ${game.answered?'disabled':''}>${I('check',17)}اعتماد الترتيب</button>`;}
function grade(good,choice){if(game.answered)return;game.answered=true;game.correct=good;game.choice=choice;if(good)game.scores[game.round%2]+=10;renderGame();}
function trophy(){return `<svg width="92" height="92" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M30 15h40v29c0 15-9 23-20 23s-20-8-20-23Z" fill="#f3ca64" stroke="#9b793c" stroke-width="2"/><path d="M30 22H16v14c0 10 9 16 18 16m36-30h14v14c0 10-9 16-18 16" stroke="#d6ac50" stroke-width="7"/><path d="M44 67h12v14H44Zm-14 18h40v8H30Z" fill="#8dad8b" stroke="#5c8065" stroke-width="2"/><path d="m50 25 4 9 10 1-8 7 2 10-8-5-8 5 2-10-8-7 10-1Z" fill="#fff4c2"/></svg>`;}
function confetti(root){let container=document.createElement('div');container.className='confetti';container.setAttribute('aria-hidden','true');for(let i=0;i<28;i++){let x=document.createElement('i');x.style.left=`${(i*37)%100}%`;x.style.background=['#e8b96b','#8dbb9c','#ddaa9c','#91bac0'][i%4];x.style.animationDelay=`${(i%7)*.09}s`;container.append(x);}root.append(container);setTimeout(()=>container.remove(),4200);}

$('#homeButton').innerHTML=I('home',20);$('#indexButton').innerHTML=I('index',19)+'<span>الفهرس</span>';$('#fullscreenButton').innerHTML=I('full',20);$('.spiral').innerHTML='<i></i>'.repeat(12);$('#homeButton').addEventListener('click',()=>renderPage(0,{focus:true}));$('#indexButton').addEventListener('click',()=>renderPage(0,{toc:true,focus:true}));$('#previousButton').addEventListener('click',()=>{if(current>0)renderPage(current-1,{focus:true});});$('#nextButton').addEventListener('click',()=>renderPage(current===pages.length-1?0:current+1,{focus:true}));$('#fullscreenButton').addEventListener('click',async()=>{if(document.body.classList.contains('presentation')){document.body.classList.remove('presentation');window.scrollTo({top:0,behavior:'instant'});}else{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else document.body.classList.add('presentation');}catch{document.body.classList.add('presentation');}}const active=!!document.fullscreenElement||document.body.classList.contains('presentation');$('#fullscreenButton').setAttribute('aria-label',active?'الخروج من ملء الشاشة':'ملء الشاشة');$('#fullscreenButton').setAttribute('aria-pressed',String(active));});document.addEventListener('fullscreenchange',()=>{const active=!!document.fullscreenElement||document.body.classList.contains('presentation');$('#fullscreenButton').setAttribute('aria-label',active?'الخروج من ملء الشاشة':'ملء الشاشة');$('#fullscreenButton').setAttribute('aria-pressed',String(active));});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA|BUTTON/.test(document.activeElement?.tagName)||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowLeft'){e.preventDefault();if(current<pages.length-1)renderPage(current+1,{focus:true});}if(e.key==='ArrowRight'){e.preventDefault();if(current>0)renderPage(current-1,{focus:true});}});renderPage(0);
})();
</script>
